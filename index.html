const MEMORY_ICONS = ["🌙", "🌿", "☁️", "🌸", "💧", "⭐"];

const SUDOKU_PUZZLES = [
  {
    given: [1, 0, 3, 4, 0, 4, 1, 0, 2, 1, 0, 3, 0, 3, 2, 1],
    solution: [1, 2, 3, 4, 3, 4, 1, 2, 2, 1, 4, 3, 4, 3, 2, 1],

  },
  {

];

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function rand(n) {
  return Math.floor(Math.random() * n);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rand(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeToneDataUri(freq, seconds) {
  const sampleRate = 8000;
  const numSamples = Math.floor(sampleRate * seconds);
  const buffer = new ArrayBuffer(44 + numSamples);
  const view = new DataView(buffer);
  const writeString = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeString(0, "RIFF");
  view.setUint32(4, 36 + numSamples, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate, true);
  view.setUint16(32, 1, true);
  view.setUint16(34, 8, true);
  writeString(36, "data");
  view.setUint32(40, numSamples, true);
  for (let i = 0; i < numSamples; i++) {
    const t = i / sampleRate;
    const env = Math.min(1, t * 15) * Math.min(1, (seconds - t) * 15);
    const sample = Math.sin(2 * Math.PI * freq * t) * env;
    view.setUint8(44 + i, Math.floor((sample * 0.5 + 0.5) * 255));
  }
  let binary = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return "data:audio/wav;base64," + btoa(binary);
}

const TONE_DEFS = {
  inhale: [392, 3.6],
  exhale: [330, 3.6],
  hold1: [494, 0.5],
  hold2: [262, 0.5],
  chimeA: [528, 1.2],
  chimeB: [660, 1.0],
  pop: [660, 0.4],
  test: [440, 0.8],
};

function wait(ms) {
  return new Promise((res) => setTimeout(res, ms));
}

function Plant({ level }) {
  const stage = LEVELS.slice().reverse().find((l) => level >= l.min) || LEVELS[0];
  const leafPositions = [
    [-14, 62], [14, 50], [-16, 38], [16, 26], [-12, 16], [12, 8],
  ].slice(0, stage.leaves);
  return (
    <svg width="120" height="140" viewBox="0 0 120 140" style={{ overflow: "visible" }}>
      <ellipse cx="60" cy="128" rx="30" ry="6" fill="#E3D9C6" opacity="0.7" />
      {stage.stems > 0 && (
        <line x1="60" y1="128" x2="60" y2="60" stroke="#A9B388" strokeWidth="3" strokeLinecap="round" />
      )}
      {leafPositions.map(([dx, dy], i) => (
        <ellipse
          key={i}
          cx={60 + dx}
          cy={128 - dy}
          rx="10"
          ry="5"
          fill="#A9B388"
          opacity="0.9"
          transform={`rotate(${dx > 0 ? -35 : 35} ${60 + dx} ${128 - dy})`}
        />
      ))}
      {stage.flower && (
        <g>
          <circle cx="60" cy="60" r="6" fill="#F4D58D" />
          {[0, 60, 120, 180, 240, 300].map((a) => (
            <ellipse
              key={a}
              cx="60"
              cy="60"
              rx="4"
              ry="9"
              fill="#E3AFAF"
              transform={`rotate(${a} 60 60) translate(0 -10)`}
            />
          ))}
        </g>
      )}
      {stage.stems === 0 && <ellipse cx="60" cy="124" rx="6" ry="4" fill="#A9B388" />}
    </svg>
  );
}

function Haven() {
  const toneUrls = React.useMemo(() => {
    const map = {};
    Object.entries(TONE_DEFS).forEach(([key, [freq, dur]]) => {
      map[key] = makeToneDataUri(freq, dur);
    });
    return map;
  }, []);

  const playSound = useCallback(
    (key) => {
      try {
        const audio = new Audio(toneUrls[key]);
        audio.volume = 1;
        const p = audio.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {
        /* audio unavailable, fail silently */
      }
    },
    [toneUrls]
  );

  const playChime = useCallback(() => {
    playSound("chimeA");
    setTimeout(() => playSound("chimeB"), 260);
  }, [playSound]);

  const [soundChecked, setSoundChecked] = useState(false);
  const [soundConfirmed, setSoundConfirmed] = useState(false);

  const [pageIdx, setPageIdx] = useState(0);
  const [moodKey, setMoodKey] = useState(null);
  const [moodMessage, setMoodMessage] = useState(null);
  const [moodNote, setMoodNote] = useState("");

  const [breathPhase, setBreathPhase] = useState("idle");
  const [cycle, setCycle] = useState(0);
  const [breathRunning, setBreathRunning] = useState(false);
  const cancelRef = useRef(false);

  const [gameChoice, setGameChoice] = useState("catch");

  const [particles, setParticles] = useState([]);
  const [caught, setCaught] = useState(0);
  const spawnRef = useRef(null);

  const [memoryCards, setMemoryCards] = useState([]);
  const [memorySelected, setMemorySelected] = useState([]);
  const [memoryLocked, setMemoryLocked] = useState(false);

  const [sudokuIdx, setSudokuIdx] = useState(() => rand(SUDOKU_PUZZLES.length));
  const [sudokuGrid, setSudokuGrid] = useState(() => [...SUDOKU_PUZZLES[0].given]);
  const [sudokuMsg, setSudokuMsg] = useState("");

  const [quoteIdx, setQuoteIdx] = useState(() => rand(QUOTES.length));
  const [factIdx, setFactIdx] = useState(() => rand(FACTS.length));

  const [progress, setProgress] = useState({ completedDates: [], customActivities: [] });
  const [customInput, setCustomInput] = useState("");

  const task = TASKS[new Date().getDate() % TASKS.length];
  const doneToday = progress.completedDates.includes(todayKey());
  const level = progress.completedDates.length;

  useEffect(() => {
    try {
      const raw = localStorage.getItem("haven-progress");
      if (raw) setProgress(JSON.parse(raw));
    } catch (e) {
      /* no saved progress yet */
    }
  }, []);

  useEffect(() => {
    setSudokuGrid([...SUDOKU_PUZZLES[sudokuIdx].given]);
    setSudokuMsg("");
  }, [sudokuIdx]);

  useEffect(() => {
    if (pageIdx === 3) setQuoteIdx(rand(QUOTES.length));
    if (pageIdx === 5) setFactIdx(rand(FACTS.length));
  }, [pageIdx]);

  const shuffleMemory = useCallback(() => {
    const deck = shuffle([...MEMORY_ICONS, ...MEMORY_ICONS]).map((icon, i) => ({
      id: i,
      icon,
      flipped: false,
      matched: false,
    }));
    setMemoryCards(deck);
    setMemorySelected([]);
    setMemoryLocked(false);
  }, []);

  useEffect(() => {
    if (pageIdx === 2 && gameChoice === "memory" && memoryCards.length === 0) {
      shuffleMemory();
    }
  }, [pageIdx, gameChoice, memoryCards.length, shuffleMemory]);

  const saveProgress = useCallback((next) => {
    setProgress(next);
    try {
      localStorage.setItem("haven-progress", JSON.stringify(next));
    } catch (e) {
      /* storage unavailable, keep in memory only */
    }
  }, []);

  const markTaskDone = () => {
    if (doneToday) return;
    const next = { ...progress, completedDates: [...progress.completedDates, todayKey()] };
    saveProgress(next);
  };

  const addCustomActivity = () => {
    const val = customInput.trim();
    if (!val) return;
    const next = { ...progress, customActivities: [val, ...progress.customActivities].slice(0, 12) };
    saveProgress(next);
    setCustomInput("");
  };

  const pickMood = (key) => {
    const pool = MOOD_MESSAGES[key];
    setMoodKey(key);
    setMoodMessage(pool[rand(pool.length)]);
  };

  useEffect(() => {
    if (pageIdx !== 2 || gameChoice !== "catch") {
      clearInterval(spawnRef.current);
      setParticles([]);
      return;
    }
    spawnRef.current = setInterval(() => {
      setParticles((prev) => {
        if (prev.length > 6) return prev;
        const id = Math.random().toString(36).slice(2);
        const palette = ["#E3AFAF", "#A9B388", "#AFCBC9", "#F4D58D"];
        const p = {
          id,
          x: 8 + Math.random() * 84,
          y: 10 + Math.random() * 70,
          size: 40 + Math.random() * 40,
          hue: palette[rand(palette.length)],
        };
        setTimeout(() => {
          setParticles((cur) => cur.filter((c) => c.id !== id));
        }, 4200);
        return [...prev, p];
      });
    }, 1100);
    return () => clearInterval(spawnRef.current);
  }, [pageIdx, gameChoice]);

  const popParticle = (id) => {
    setParticles((prev) => prev.filter((p) => p.id !== id));
    setCaught((c) => c + 1);
    playSound("pop");
  };

  const flipMemoryCard = (id) => {
    if (memoryLocked) return;
    setMemoryCards((prev) => {
      const card = prev.find((c) => c.id === id);
      if (!card || card.flipped || card.matched) return prev;
      const next = prev.map((c) => (c.id === id ? { ...c, flipped: true } : c));
      const selected = [...memorySelected, id];
      setMemorySelected(selected);
      if (selected.length === 2) {
        setMemoryLocked(true);
        const [a, b] = selected;
        const cardA = next.find((c) => c.id === a);
        const cardB = next.find((c) => c.id === b);
        if (cardA.icon === cardB.icon) {
          playSound("pop");
          setTimeout(() => {
            setMemoryCards((cur) =>
              cur.map((c) => (c.id === a || c.id === b ? { ...c, matched: true } : c))
            );
            setMemorySelected([]);
            setMemoryLocked(false);
          }, 400);
        } else {
          setTimeout(() => {
            setMemoryCards((cur) =>
              cur.map((c) => (c.id === a || c.id === b ? { ...c, flipped: false } : c))
            );
            setMemorySelected([]);
            setMemoryLocked(false);
          }, 850);
        }
      }
      return next;
    });
  };

  const updateSudoku = (i, val) => {
    if (SUDOKU_PUZZLES[sudokuIdx].given[i] !== 0) return;
    const v = val.replace(/[^1-4]/g, "").slice(-1);
    setSudokuGrid((prev) => {
      const next = [...prev];
      next[i] = v ? Number(v) : 0;
      return next;
    });
  };

  const checkSudoku = () => {
    const solved = sudokuGrid.every((v, i) => v === SUDOKU_PUZZLES[sudokuIdx].solution[i]);
    if (solved) {
      playChime();
      setSudokuMsg("Solved it! 🌿");
    } else {
      setSudokuMsg("Not quite yet — take your time.");
    }
  };

  const newSudoku = () => {
    let next = rand(SUDOKU_PUZZLES.length);
    if (SUDOKU_PUZZLES.length > 1) {
      while (next === sudokuIdx) next = rand(SUDOKU_PUZZLES.length);
    }
    setSudokuIdx(next);
  };

  const runBreathing = async () => {
    cancelRef.current = false;
    setBreathRunning(true);
    setCycle(0);
    for (let i = 0; i < 4; i++) {
      if (cancelRef.current) break;
      setBreathPhase("inhale");
      await wait(4000);
      if (cancelRef.current) break;
      setBreathPhase("hold1");
      await wait(4000);
      if (cancelRef.current) break;
      setBreathPhase("exhale");
      await wait(4000);
      if (cancelRef.current) break;
      setBreathPhase("hold2");
      await wait(4000);
      setCycle((c) => c + 1);
    }
    if (!cancelRef.current) setBreathPhase("done");
    setBreathRunning(false);
  };

  const stopBreathing = () => {
    cancelRef.current = true;
    setBreathRunning(false);
    setBreathPhase("idle");
    setCycle(0);
  };

  const phaseLabel = {
    idle: "When you're ready",
    inhale: "Breathe in…",
    hold1: "Hold…",
    exhale: "Breathe out…",
    hold2: "Hold…",
    done: "Open your eyes. Notice how you feel now.",
  }[breathPhase];

  const circleScale = { idle: 1, inhale: 1.35, hold1: 1.35, exhale: 0.85, hold2: 0.85, done: 1.1 }[breathPhase];

  const goNext = () => setPageIdx((p) => Math.min(p + 1, PAGES.length - 1));
  const goTo = (i) => setPageIdx(i);

  return (
    <div style={styles.app}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #A9B388; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) {
          .breath-circle { transition: none !important; }
        }
      `}</style>

      <header style={styles.header}>
        <div style={styles.brand}>Haven</div>
        <nav style={styles.nav}>
          {PAGES.map((p, i) => (
            <button
              key={p.id}
              onClick={() => goTo(i)}
              style={{ ...styles.navDot, ...(i === pageIdx ? styles.navDotActive : {}) }}
              aria-current={i === pageIdx ? "page" : undefined}
            >
              {p.label}
            </button>
          ))}
        </nav>
      </header>

      <main style={styles.main}>
        {pageIdx === 0 && (
          <section style={styles.section}>
            <h1 style={styles.h1}>How are you, really?</h1>
            <p style={styles.sub}>No wrong answer. This just helps Haven meet you where you are.</p>
            <div style={styles.moodGrid}>
              {MOODS.map((m) => (
                <button
                  key={m.key}
                  onClick={() => pickMood(m.key)}
                  style={{ ...styles.moodBtn, ...(moodKey === m.key ? styles.moodBtnActive : {}) }}
                >
                  {m.label}
                </button>
              ))}
            </div>
            <textarea
              value={moodNote}
              onChange={(e) => setMoodNote(e.target.value)}
              placeholder="Want to say more? (optional)"
              style={styles.textarea}
              rows={3}
            />
            {moodMessage && <p style={styles.moodEcho}>{moodMessage}</p>}
            <button style={styles.primaryBtn} onClick={goNext}>Continue</button>
          </section>
        )}

        {pageIdx === 1 && (
          <section style={styles.section}>
            <h1 style={styles.h1}>Let's breathe together</h1>
            <p style={styles.sub}>
              Follow the circle — it grows as you breathe in, holds, then settles as you breathe out.
              Four rounds, about a minute total.
            </p>
            <div style={styles.breathWrap}>
              <div className="breath-circle" style={{ ...styles.breathCircle, transform: `scale(${circleScale})` }} />
              <div style={styles.breathLabel}>{phaseLabel}</div>
              {breathRunning && <div style={styles.breathCount}>Round {Math.min(cycle + 1, 4)} of 4</div>}
            </div>
            <div style={styles.row}>
              {!breathRunning && breathPhase !== "done" && (
                <button style={styles.primaryBtn} onClick={runBreathing}>Start breathing</button>
              )}
              {breathRunning && <button style={styles.ghostBtn} onClick={stopBreathing}>Stop</button>}
              {breathPhase === "done" && <button style={styles.primaryBtn} onClick={goNext}>Continue</button>}
              {!breathRunning && breathPhase !== "done" && (
                <button style={styles.linkBtn} onClick={goNext}>Skip for now</button>
              )}
            </div>
          </section>
        )}

        {pageIdx === 2 && (
          <section style={styles.section}>
            <h1 style={styles.h1}>Unwind for a minute</h1>
            <p style={styles.sub}>Pick whatever feels right today — none of these are about winning.</p>
            <div style={styles.gameTabs}>
              <button
                style={{ ...styles.gameTab, ...(gameChoice === "catch" ? styles.gameTabActive : {}) }}
                onClick={() => setGameChoice("catch")}
              >
                Catch the Calm
              </button>
              <button
                style={{ ...styles.gameTab, ...(gameChoice === "memory" ? styles.gameTabActive : {}) }}
                onClick={() => setGameChoice("memory")}
              >
                Memory Garden
              </button>
              <button
                style={{ ...styles.gameTab, ...(gameChoice === "sudoku" ? styles.gameTabActive : {}) }}
                onClick={() => setGameChoice("sudoku")}
              >
                Mini Sudoku
              </button>
            </div>

            {gameChoice === "catch" && (
              <div style={styles.playArea}>
                {particles.map((p) => (
                  <button
                    key={p.id}
                    onClick={() => popParticle(p.id)}
                    aria-label="calm moment"
                    style={{
                      ...styles.particle,
                      left: `${p.x}%`,
                      top: `${p.y}%`,
                      width: p.size,
                      height: p.size,
                      background: `radial-gradient(circle, ${p.hue}88, ${p.hue}00 70%)`,
                      borderColor: p.hue,
                    }}
                  />
                ))}
                {caught > 0 && <div style={styles.caughtBadge}>{caught} moments caught</div>}
              </div>
            )}

            {gameChoice === "memory" && (
              <div>
                <div style={styles.memoryGrid}>
                  {memoryCards.map((c) => (
                    <button
                      key={c.id}
                      onClick={() => flipMemoryCard(c.id)}
                      style={{
                        ...styles.memoryCard,
                        ...(c.flipped || c.matched ? styles.memoryCardFlipped : {}),
                      }}
                    >
                      {c.flipped || c.matched ? c.icon : ""}
                    </button>
                  ))}
                </div>
                <div style={styles.row}>
                  {memoryCards.length > 0 && memoryCards.every((c) => c.matched) && (
                    <div style={styles.successMsg}>You matched them all 🌸</div>
                  )}
                  <button style={styles.linkBtn} onClick={shuffleMemory}>Reshuffle</button>
                </div>
              </div>
            )}

            {gameChoice === "sudoku" && (
              <div>
                <p style={{ ...styles.sub, marginTop: -6 }}>Fill each row, column, and 2×2 box with 1–4, no repeats.</p>
                <div style={styles.sudokuGrid}>
                  {sudokuGrid.map((v, i) => {
                    const isGiven = SUDOKU_PUZZLES[sudokuIdx].given[i] !== 0;
                    return (
                      <input
                        key={i}
                        value={v || ""}
                        onChange={(e) => updateSudoku(i, e.target.value)}
                        disabled={isGiven}
                        style={{
                          ...styles.sudokuCell,
                          ...(isGiven ? styles.sudokuCellGiven : {}),
                          borderRight: (i + 1) % 4 === 2 ? "2px solid #C9BFA8" : styles.sudokuCell.border,
                          borderBottom: i < 8 || (i >= 4 && i < 8) ? styles.sudokuCell.border : undefined,
                        }}
                        inputMode="numeric"
                        maxLength={1}
                      />
                    );
                  })}
                </div>
                <div style={styles.row}>
                  <button style={styles.primaryBtn} onClick={checkSudoku}>Check</button>
                  <button style={styles.ghostBtn} onClick={newSudoku}>New puzzle</button>
                </div>
                {sudokuMsg && <div style={styles.successMsg}>{sudokuMsg}</div>}
              </div>
            )}

            <button style={styles.linkBtn} onClick={goNext}>Continue</button>
          </section>
        )}

        {pageIdx === 3 && (
          <section style={styles.section}>
            <h1 style={styles.h1}>Today's reminder</h1>
            <blockquote style={styles.quote}>{QUOTES[quoteIdx]}</blockquote>
            <div style={styles.row}>
              <button style={styles.ghostBtn} onClick={() => setQuoteIdx(rand(QUOTES.length))}>Show me another</button>
            </div>
            <button style={styles.primaryBtn} onClick={goNext}>Continue</button>
          </section>
        )}

        {pageIdx === 4 && (
          <section style={styles.section}>
            <h1 style={styles.h1}>Your step for today</h1>
            <div style={styles.todayGrid}>
              <div style={styles.taskCard}>
                <div style={styles.taskLabel}>{task.label}</div>
                <div style={styles.taskDetail}>{task.detail}</div>
                <button style={doneToday ? styles.doneBtn : styles.primaryBtn} onClick={markTaskDone} disabled={doneToday}>
                  {doneToday ? "Done for today ✓" : "I did this"}
                </button>

                <div style={styles.customBox}>
                  <div style={styles.miniLabel}>Have your own idea?</div>
                  <div style={styles.customRow}>
                    <input
                      value={customInput}
                      onChange={(e) => setCustomInput(e.target.value)}
                      placeholder="e.g. Nap for 20 minutes"
                      style={styles.input}
                    />
                    <button style={styles.ghostBtn} onClick={addCustomActivity}>Add</button>
                  </div>
                  {progress.customActivities.length > 0 && (
                    <div style={styles.chipRow}>
                      {progress.customActivities.map((a, i) => (
                        <span key={i} style={styles.chip}>{a}</span>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <div style={styles.plantCard}>
                <Plant level={level} />
                <div style={styles.levelName}>
                  {(LEVELS.slice().reverse().find((l) => level >= l.min) || LEVELS[0]).name}
                </div>
                <div style={styles.levelSub}>{level} day{level === 1 ? "" : "s"} of showing up for yourself</div>
              </div>
            </div>
            <button style={styles.linkBtn} onClick={goNext}>Continue</button>
          </section>
        )}

        {pageIdx === 5 && (
          <section style={styles.section}>
            <h1 style={styles.h1}>Wait, really?</h1>
            <p style={styles.sub}>A small, strange fact to give your brain something fun to chew on.</p>
            <div style={styles.factCard}>{FACTS[factIdx]}</div>
            <div style={styles.row}>
              <button style={styles.ghostBtn} onClick={() => setFactIdx(rand(FACTS.length))}>Another one</button>
            </div>
            <button style={styles.primaryBtn} onClick={goNext}>Continue</button>
          </section>
        )}

        {pageIdx === 6 && (
          <section style={styles.section}>
            <h1 style={styles.h1}>Worth knowing</h1>
            <p style={styles.sub}>The psychology behind burnout, rest, and motivation — briefly.</p>
            <div style={styles.readGrid}>
              {READS.map((r, i) => (
                <div key={i} style={styles.readCard}>
                  <div style={styles.readTitle}>{r.title}</div>
                  <div style={styles.readBody}>{r.body}</div>
                </div>
              ))}
            </div>
            <button style={styles.ghostBtn} onClick={() => goTo(0)}>Start over</button>
          </section>
        )}
      </main>

      <footer style={styles.footer}>Haven — a small pause, whenever you need one.</footer>
    </div>
  );
}
